<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幽玄</title>
<style>
:root{--ink:#17243d;--muted:#78869d;--blue:#5c8fd6;--deep:#396da9;--sky:#eaf3ff;--line:#e1e8f1;--paper:#f7f9fc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI",Microsoft YaHei,sans-serif}.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:66px;display:flex;align-items:center;padding:0 28px;gap:34px;background:#fff;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;white-space:nowrap}.logo b{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px}.nav{display:flex;gap:25px;color:var(--muted)}.nav span:first-child{color:var(--deep);font-weight:700}.search{margin-left:auto;width:230px;height:34px;border:1px solid var(--line);border-radius:18px;background:#fafcff;color:#9aa6b8;padding:7px 13px}.body{display:flex;flex:1;min-height:0}.side{width:205px;padding:28px 18px;background:#fff;border-right:1px solid var(--line)}.side h4{margin:0 12px 11px;color:#a1adbd;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.side button{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:10px 12px;color:var(--muted);cursor:pointer}.side button.active,.side button:hover{background:var(--sky);color:var(--deep);font-weight:700}.side hr{border:0;border-top:1px solid var(--line);margin:22px 12px}.main{flex:1;overflow:auto;padding:28px 34px 118px}.hero{height:185px;border-radius:20px;background:linear-gradient(115deg,#eaf5ff,#f2f7ff 52%,#e9f0ff);padding:30px 38px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:350px;height:350px;border:1px solid #5c8fd633;border-radius:50%;right:-55px;top:-150px}.hero small{color:var(--deep);font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:800}.hero h1{margin:10px 0 8px;font-size:35px;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);font-size:14px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 13px}.section-head h2{font-size:20px;margin:0}.section-head span{color:var(--muted);font-size:12px}.playlist{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:34px minmax(250px,1fr) 130px 90px 82px 40px;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid #edf1f6}.row:last-child{border-bottom:0}.row:hover{background:#f8fbff}.no{color:#a0adbd;font-size:12px}.name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:12px;color:var(--muted)}.license{font-size:11px;color:#8a98ac}.play{width:32px;height:32px;border:0;border-radius:50%;background:var(--sky);color:var(--deep);display:grid;place-items:center;cursor:pointer}.play:hover,.play.playing{background:var(--blue);color:#fff}.play svg{width:13px;margin-left:2px}.credits{margin-top:22px;color:var(--muted);font-size:11px}.credits a{color:var(--deep)}.player{position:absolute;bottom:0;left:205px;right:0;height:86px;background:#fffffff5;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:17px;box-shadow:0 -10px 26px #2c4c7814}.cover{height:45px;width:45px;border-radius:11px;background:linear-gradient(135deg,#cfe4ff,#7da6d2);display:grid;place-items:center;color:#fff;font-size:20px}.now{min-width:205px}.now small{color:var(--muted);font-size:11px}.now strong{display:block;font-size:13px}.player audio{height:34px;flex:1;max-width:620px}.hint{margin-left:auto;color:var(--muted);font-size:11px}@media(max-width:900px){.side{width:165px}.row{grid-template-columns:27px minmax(180px,1fr) 70px 40px}.tag,.license{display:none}.player{left:165px}.hint{display:none}} 
</style></head>
<body><div class="app"><header class="top"><div class="logo"><b>♫</b>幽玄</div><div class="nav"><span>首页</span><span>我的音乐</span><span>播放列表</span></div><div class="search" id="search">⌕　搜索歌曲或歌手</div></header><div class="body"><aside class="side"><h4>发现音乐</h4><button class="active" data-filter="全部">推荐歌单</button><button data-filter="放松">放松听听</button><button data-filter="阅读">阅读时光</button><button data-filter="旅行">轻快旅行</button><hr><h4>我的音乐</h4><button data-filter="全部">本地音乐　10</button><button id="openCredits">授权说明</button></aside><main class="main"><section class="hero"><small>Youxuan music desktop</small><h1>听一首，松一口气。</h1><p>清新的原声小曲，陪你放松、阅读、散步，或者什么也不做。</p></section><div class="section-head"><h2>为你推荐</h2><span>10 首原声与木吉他纯音乐</span></div><div class="playlist" id="playlist"></div><div class="credits" id="credits">音乐均来自 Internet Archive 的 Creative Commons 授权作品。非商业使用需保留署名；完整作者、来源和许可证信息见 <a href="ATTRIBUTION.txt">ATTRIBUTION.txt</a>。</div></main></div><footer class="player"><div class="cover">♫</div><div class="now"><small>正在播放</small><strong id="now">选择一首歌开始</strong></div><audio id="audio" controls preload="metadata"></audio><span class="hint">让音乐陪你自在一点</span></footer></div><script>
const tracks=[
 {title:'Nylon and Turtle',artist:'Sergi Boal',file:'Sergi Boal - Nylon and Turtle.mp3',tag:'放松',license:'CC BY-NC-SA 4.0'},
 {title:'Ice Voice',artist:'Sergi Boal',file:'Sergi Boal - Ice Voice.mp3',tag:'阅读',license:'CC BY-NC-SA 4.0'},
 {title:'Morning Mist over Rock Creek',artist:'Art Sonic',file:'Art Sonic - Morning Mist over Rock Creek.mp3',tag:'清新',license:'CC BY-NC-SA 4.0'},
 {title:'Watching the Rain',artist:'Art Sonic',file:'Art Sonic - Watching the Rain.mp3',tag:'放松',license:'CC BY-NC-SA 4.0'},
 {title:'Jupiter the Blue',artist:'Gillicuddy',file:'Gillicuddy - Jupiter the Blue.mp3',tag:'旅行',license:'CC BY-NC 3.0'},
 {title:'A Sheltered Life',artist:'Fred Baty / Crepusculum',file:'Fred Baty (Crepusculum) - A Sheltered Life.mp3',tag:'清新',license:'CC BY-NC-SA 2.5'},
 {title:'Kintyre',artist:'Fred Baty / Crepusculum',file:'Fred Baty (Crepusculum) - Kintyre.mp3',tag:'旅行',license:'CC BY-NC-SA 2.5'},
 {title:'StarCove',artist:'dmyra',file:'dmyra - StarCove.mp3',tag:'放松',license:'CC BY-NC-ND 3.0'},
 {title:'Entune',artist:'dmyra',file:'dmyra - Entune.mp3',tag:'阅读',license:'CC BY-NC-ND 3.0'},
 {title:'Mar Revisitar',artist:'Arrial',file:'Arrial - Mar Revisitar.mp3',tag:'旅行',license:'CC BY-NC-ND 2.0'}
];
const list=document.getElementById('playlist'),audio=document.getElementById('audio'),now=document.getElementById('now');let filter='全部';
function render(){list.innerHTML=tracks.filter(t=>filter==='全部'||t.tag===filter).map((t,i)=>`<div class="row" data-file="${t.file}" data-title="${t.title}"><div class="no">${String(tracks.indexOf(t)+1).padStart(2,'0')}</div><div><div class="name">${t.title}</div><div class="artist">${t.artist}</div></div><div class="tag">${t.tag}</div><div class="license">${t.license}</div><div class="no">MP3</div><button class="play" aria-label="播放 ${t.title}"><svg viewBox="0 0 20 20" fill="currentColor"><path d="m6 4 10 6-10 6V4Z"/></svg></button></div>`).join('');list.querySelectorAll('.row').forEach(row=>row.querySelector('.play').addEventListener('click',()=>{const src='audio/'+row.dataset.file;if(audio.src.endsWith(encodeURI(src))&&!audio.paused){audio.pause();row.querySelector('.play').classList.remove('playing');return}audio.src=src;now.textContent=row.dataset.title;audio.play();list.querySelectorAll('.play').forEach(b=>b.classList.remove('playing'));row.querySelector('.play').classList.add('playing')}))}render();document.querySelectorAll('.side button[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));document.getElementById('search').addEventListener('click',()=>{const q=prompt('搜索歌曲或歌手');if(q===null)return;const hit=tracks.find(t=>(t.title+t.artist).toLowerCase().includes(q.toLowerCase()));if(hit){filter='全部';render();now.textContent='已找到：'+hit.title}else now.textContent='没有找到这首歌'});audio.addEventListener('ended',()=>now.textContent='选择一首歌开始');
</script></body></html>
